    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#2E62B8" stop-opacity=".45"/><stop offset="1" stop-color="#2E62B8" stop-opacity="0"/></radialGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#CFE0FF"/></linearGradient>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
