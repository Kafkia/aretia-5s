  <g fill="#4FA3FF" opacity=".8"><circle cx="40" cy="150" r="6"/><circle cx="40" cy="362" r="6"/><circle cx="472" cy="150" r="6"/><circle cx="472" cy="362" r="6"/><circle cx="256" cy="30" r="6"/><circle cx="256" cy="482" r="6"/></g>
  <!-- anel com os 5 Sensos -->
