  <g fill="#fff"><circle cx="256" cy="96" r="7"/><circle cx="408" cy="207" r="7"/><circle cx="350" cy="385" r="7"/><circle cx="162" cy="385" r="7"/><circle cx="104" cy="207" r="7"/></g>
  <text x="256" y="310" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, Arial, sans-serif" font-weight="800" font-size="160" letter-spacing="-4" fill="url(#txt)">5S</text>
